# Proposal (Sprint 16 T-01): nginx server block for the admin hostname, behind the Cloudflare tunnel
# and Cloudflare Access. Nothing here is installed by the repo; the operator copies it to
# /etc/nginx/sites-available/lanbilder-admin and enables it.
#
# The tunnel (cloudflared) forwards the admin hostname to this vhost over plain HTTP on the host;
# Access has already authenticated the visitor and adds Cf-Access-Jwt-Assertion. The backend
# verifies that JWT itself (signature, aud, exp) and never trusts the hostname alone.
#
# Replace 82j17zj.phetast.nu with the chosen admin label (TODO.md FUT-02 "Decisions").

upstream lanbilder_admin {
    server 127.0.0.1:3100;
    keepalive 8;
}

server {
    listen 127.0.0.1:8080;            # match the tunnel's ingress for this hostname (http://127.0.0.1:8080)
    server_name 82j17zj.phetast.nu;

    access_log /var/log/nginx/lanbilder-admin.access.log;
    error_log  /var/log/nginx/lanbilder-admin.error.log;

    # Never index, never cache, never frame.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 50m;         # one upload (FUT-02: 50 MB per file)

    # Only the tunnel speaks to this vhost; refuse anything that lacks the Access assertion so that
    # the backend never even sees anonymous requests (defence in depth, the backend checks too).
    if ($http_cf_access_jwt_assertion = "") {
        return 403;
    }

    location /api/ {
        proxy_pass http://lanbilder_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://lanbilder_admin;
    }

    # The admin UI (a separate static build, later sprint). Served only to Access-authenticated
    # visitors because of the assertion check above.
    root /mnt/storage/lanbilder-app/admin-ui;
    index index.html;
    location / {
        try_files $uri /index.html;
    }
}

